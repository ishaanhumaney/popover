<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tooltip & Speech Bubble Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Tooltip Library</h1>
        <p>Hover over the highlighted words to see the speech bubbles in action.</p>

        <div class="demo-grid">
            <p>This is a <span class="tooltip top" data-tooltip="I pop up at the top!">top tooltip</span> example.</p>
            <p>Check out this <span class="tooltip right" data-tooltip="Hello from the right side!">right tooltip</span> in a sentence.</p>
            <p>We also have a <span class="tooltip bottom" data-tooltip="Looking down here?">bottom tooltip</span> available.</p>
            <p>And finally, a <span class="tooltip left" data-tooltip="Left side, strong side!">left tooltip</span> on the edge.</p>
        </div>
    </div>
</body>
</html>
